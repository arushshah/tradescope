[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradescope"
version = "0.1.0"
description = "CLI-first vectorbt backtesting research toolkit."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "click>=8.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.6",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "lxml>=5.0",
  "yfinance>=0.2.40",
  "vectorbt>=0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
reports = [
  "quantstats>=0.0.62",
]
[project.scripts]
tradescope = "tradescope.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
