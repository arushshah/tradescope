name: ma_cross_spy_sweep_smoke
symbols:
  - SPY
start: "2023-01-01"
end: "2024-01-01"
interval: "1d"
data:
  provider: yfinance
  raw_dir: data/raw
  processed_dir: data/processed
  refresh: false
strategy:
  name: ma_cross
  params:
    fast_window:
      - 5
      - 10
    slow_window:
      - 20
      - 40
portfolio:
  init_cash: 100000
  fees: 0.0
  slippage: 0.0005
  direction: longonly
  benchmark: SPY
  cash_sharing: true
  sizing:
    method: equal_weight
results:
  output_dir: results

