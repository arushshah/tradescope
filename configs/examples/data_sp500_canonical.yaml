name: data_sp500_canonical
universe:
  presets:
    - sp500
  symbols:
    - SPY
start: "2020-01-01"
end: "2025-01-01"
interval: "1d"
data:
  provider: yfinance
  raw_dir: data/raw
  processed_dir: data/processed
  component_dir: data/components
  refresh: false
  use_canonical_coverage: true
  coverage_start: "2010-01-01"
  coverage_end: "2026-01-01"
  components:
    - ohlcv
    - research_bundle
strategy:
  name: buy_hold
  params: {}
portfolio:
  init_cash: 100000
  fees: 0.0
  slippage: 0.0005
  direction: longonly
  benchmark: SPY
  cash_sharing: true
  sizing:
    method: equal_weight
  execution:
    price: next_open
results:
  output_dir: results
  save_trades: false
  save_equity_curve: false
  save_plots: false
  save_report: false
