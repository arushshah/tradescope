name: momentum_regime_liquid_smoke
universe:
  presets:
    - liquid_single_names
  symbols:
    - SPY
start: "2020-01-01"
end: "2025-01-01"
interval: "1d"
data:
  provider: yfinance
  raw_dir: data/raw
  processed_dir: data/processed
  refresh: false
strategy:
  name: momentum_regime
  params:
    momentum_window: 126
    trend_window: 100
    regime_symbol: SPY
    regime_window: 200
    entry_quantile: 0.8
    exit_quantile: 0.6
    trade_regime_symbol: false
portfolio:
  init_cash: 100000
  fees: 0.0
  slippage: 0.0005
  direction: longonly
  benchmark: SPY
  cash_sharing: true
  sizing:
    method: equal_weight
  execution:
    price: close
  risk:
    stop_loss:
    take_profit:
    trailing_stop: false
results:
  output_dir: results
  save_trades: true
  save_equity_curve: true
  save_plots: true
  save_report: false
