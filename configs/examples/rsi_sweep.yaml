name: rsi_spy_sweep
symbols:
  - SPY
start: "2015-01-01"
end: "2025-01-01"
interval: "1d"
data:
  provider: yfinance
  raw_dir: data/raw
  processed_dir: data/processed
  refresh: false
strategy:
  name: rsi
  params:
    window:
      - 10
      - 14
      - 21
    entry_threshold:
      - 25
      - 30
    exit_threshold:
      - 55
      - 65
portfolio:
  init_cash: 100000
  fees: 0.0
  slippage: 0.0005
  direction: longonly
  benchmark: SPY
  cash_sharing: true
  sizing:
    method: equal_weight
results:
  output_dir: results
  save_report: false

