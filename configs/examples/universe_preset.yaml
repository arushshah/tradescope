name: universe_preset_example
universe:
  presets:
    #- index_etfs
    #- mega_cap_tech
    - all_nasdaq
  symbols:
    - COST
  exclude:
    - TSLA
start: "2015-01-01"
end: "2026-01-01"
interval: "1d"
data:
  provider: yfinance
  raw_dir: data/raw
  processed_dir: data/processed
  refresh: false
strategy:
  name: ma_cross
  params:
    fast_window: 5
    slow_window: 20
portfolio:
  init_cash: 100000
  fees: 0.0
  slippage: 0.0005
  direction: longonly
  benchmark: SPY
  cash_sharing: true
  sizing:
    method: equal_weight
  execution:
    price: close
  risk:
    stop_loss:
    take_profit:
    trailing_stop: false
results:
  output_dir: results
